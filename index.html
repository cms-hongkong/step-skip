<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>繽紛旋律大挑戰 - 限時衝刺模式</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-bg: #f0f2f5;
            --card-bg: rgba(255, 255, 255, 0.96);
            --stepwise-color: #4facfe;
            --skipwise-color: #f093fb;
            --accent-color: #ffed4b;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Comic Sans MS', 'Microsoft JhengHei', cursive, sans-serif;
        }

        body {
            background: linear-gradient(45deg, #ff9a9e 0%, #fad0c4 99%, #fad0c4 100%);
            min-height: 100vh;
            color: #444;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .game-container {
            max-width: 800px;
            width: 100%;
            background: var(--card-bg);
            border-radius: 40px;
            padding: 30px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.15);
            border: 8px solid #fff;
            position: relative;
        }

        header {
            text-align: center;
            margin-bottom: 25px;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 30px;
            color: white;
            box-shadow: 0 10px 20px rgba(118, 75, 162, 0.3);
            position: relative;
        }

        h1 {
            font-size: 2.3rem;
            margin-bottom: 5px;
            letter-spacing: 2px;
        }

        .game-info {
            display: flex;
            justify-content: space-around;
            gap: 15px;
            margin-bottom: 25px;
        }

        .info-box {
            background: #fff;
            border-radius: 20px;
            padding: 15px;
            flex: 1;
            text-align: center;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
            border-bottom: 4px solid #ddd;
        }

        .label { font-size: 0.9rem; color: #888; font-weight: bold; margin-bottom: 5px; }
        .value { font-size: 1.8rem; font-weight: 900; color: #333; }

        .timer-low { color: #ff5e62 !important; animation: blink 0.5s infinite; }
        @keyframes blink { 50% { opacity: 0.5; } }

        .melody-display {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            padding: 30px 20px;
            background: #f8f9fa;
            border-radius: 30px;
            margin-bottom: 20px;
            min-height: 160px;
            border: 3px dashed #ddd;
        }

        .note-card {
            width: 85px;
            height: 85px;
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            box-shadow: 0 8px 0px rgba(0,0,0,0.1);
            transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            animation: popIn 0.3s ease-out;
        }

        @keyframes popIn {
            0% { transform: scale(0); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .note-letter { font-size: 2.2rem; }
        .note-name { font-size: 0.8rem; opacity: 0.9; }

        .controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .btn {
            padding: 18px;
            border: none;
            border-radius: 25px;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-stepwise { background: linear-gradient(to bottom, #4facfe 0%, #00f2fe 100%); box-shadow: 0 6px 0 #3a8dca; }
        .btn-skipwise { background: linear-gradient(to bottom, #f093fb 0%, #f5576c 100%); box-shadow: 0 6px 0 #c276ca; }
        .btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #888; }
        .btn:disabled { background: #ccc; box-shadow: none; cursor: not-allowed; }

        .feedback {
            height: 45px;
            margin: 10px 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 15px;
            transition: all 0.3s;
        }

        .correct { color: #4cd137; transform: scale(1.05); }
        .incorrect { color: #e84118; animation: shake 0.3s; }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-8px); }
            75% { transform: translateX(8px); }
        }

        /* 模態框與排行榜樣式 */
        .modal {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            padding: 20px;
        }

        .modal-content {
            background: white;
            color: #333;
            padding: 30px;
            border-radius: 35px;
            max-width: 460px;
            width: 100%;
            text-align: center;
            max-height: 90vh;
            overflow-y: auto;
        }

        .input-group {
            margin: 20px 0;
            text-align: left;
        }

        .input-group label {
            display: block;
            font-size: 0.95rem;
            color: #666;
            margin-bottom: 8px;
            font-weight: bold;
        }

        .player-input {
            width: 100%;
            padding: 14px 20px;
            border-radius: 20px;
            border: 2px solid #ddd;
            font-size: 1.1rem;
            outline: none;
            transition: 0.3s;
        }

        .player-input:focus {
            border-color: #667eea;
            box-shadow: 0 0 10px rgba(102, 126, 234, 0.2);
        }

        .action-btn {
            width: 100%;
            margin-top: 12px;
            padding: 14px 20px;
            background: #ffed4b;
            color: #333;
            border: none;
            border-radius: 25px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 4px 0 #d4c43b;
        }

        .action-btn:hover { filter: brightness(1.05); }
        .action-btn:active { transform: translateY(2px); box-shadow: 0 2px 0 #d4c43b; }
        
        .secondary-btn {
            background: #f0f2f5;
            color: #666;
            box-shadow: 0 4px 0 #ccc;
        }

        .leaderboard-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
            font-size: 0.95rem;
        }

        .leaderboard-table th, .leaderboard-table td {
            padding: 10px 8px;
            text-align: center;
        }

        .leaderboard-table th {
            color: #888;
            border-bottom: 2px solid #eee;
        }

        .leaderboard-table tr:not(:last-child) td {
            border-bottom: 1px solid #f2f2f2;
        }

        .rank-badge {
            font-weight: bold;
            display: inline-block;
            width: 24px;
            height: 24px;
            line-height: 24px;
            border-radius: 50%;
        }
        .rank-1 { background: #ffd700; color: #fff; }
        .rank-2 { background: #c0c0c0; color: #fff; }
        .rank-3 { background: #cd7f32; color: #fff; }

        .current-player-row {
            background: #eef2ff;
            font-weight: bold;
            border-radius: 10px;
        }

        .header-actions {
            margin-top: 10px;
            display: flex;
            justify-content: center;
            gap: 10px;
        }

        .header-btn {
            background: rgba(255, 255, 255, 0.25);
            border: none;
            color: white;
            padding: 6px 14px;
            border-radius: 15px;
            font-size: 0.85rem;
            cursor: pointer;
            font-weight: bold;
        }
        .header-btn:hover { background: rgba(255, 255, 255, 0.4); }
    </style>
</head>
<body>

    <div class="game-container">
        <header>
            <h1>🎶 旋律大挑戰</h1>
            <p id="playerGreeting">請先設定暱稱開始遊戲</p>
            <div class="header-actions">
                <button class="header-btn" onclick="openStartModal()"><i class="fas fa-user-edit"></i> 更改玩家</button>
                <button class="header-btn" onclick="openLeaderboardModal()"><i class="fas fa-trophy"></i> 排行榜</button>
            </div>
        </header>

        <div class="game-info">
            <div class="info-box">
                <div class="label">剩餘時間</div>
                <div class="value" id="timer">60s</div>
            </div>
            <div class="info-box">
                <div class="label">目前分數</div>
                <div class="value" id="score">0</div>
            </div>
            <div class="info-box">
                <div class="label">最高連勝</div>
                <div class="value" id="streak">0</div>
            </div>
        </div>

        <div class="melody-display" id="melodyArea"></div>

        <div class="feedback" id="feedback">請點擊下方按鈕或鍵盤快捷鍵作答</div>

        <div class="controls">
            <button class="btn btn-stepwise" onclick="checkAnswer('stepwise')" id="btnStep">
                <i class="fas fa-stairs"></i> 級進 (←)
            </button>
            <button class="btn btn-skipwise" onclick="checkAnswer('skipwise')" id="btnSkip">
                <i class="fas fa-rabbit-hop"></i> 跳進 (→)
            </button>
        </div>
    </div>

    <!-- 起始 / 名字輸入視窗 -->
    <div id="startModal" class="modal">
        <div class="modal-content">
            <h2 style="font-size: 1.8rem; margin-bottom: 10px;">👋 歡迎加入衝刺！</h2>
            <p style="color: #666; font-size: 0.95rem;">在 60 秒內辨識旋律是連續階梯（級進）還是跨音跳躍（跳進）</p>
            
            <div class="input-group">
                <label for="playerNameInput">玩家暱稱：</label>
                <input type="text" id="playerNameInput" class="player-input" maxlength="10" placeholder="例如：莫札特" value="旋律新手">
            </div>

            <button class="action-btn" onclick="confirmNameAndStart()">開始衝刺 🚀</button>
            <button class="action-btn secondary-btn" onclick="openLeaderboardModal()">查看排行榜 🏆</button>
        </div>
    </div>

    <!-- 遊戲結束視窗 -->
    <div id="gameOverModal" class="modal">
        <div class="modal-content">
            <h2 style="font-size: 2.2rem; margin-bottom: 10px;">⏰ 時間到！</h2>
            <p style="font-size: 1.1rem; color: #666;"><span id="resultPlayerName"></span> 的成績</p>
            <div style="font-size: 3.8rem; font-weight: 900; color: #764ba2; margin: 5px 0;" id="finalScore">0</div>
            <p id="finalStats" style="margin-bottom: 15px; color: #555;"></p>

            <button class="action-btn" onclick="restartCurrentPlayer()">再次挑戰 <i class="fas fa-redo"></i></button>
            <button class="action-btn secondary-btn" onclick="openLeaderboardModal()">查看完整排行榜 <i class="fas fa-trophy"></i></button>
        </div>
    </div>

    <!-- 排行榜視窗 -->
    <div id="leaderboardModal" class="modal">
        <div class="modal-content">
            <h2 style="font-size: 1.8rem; margin-
